        fill="white"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        SKT 유심 안전도 체크
      </text>
      
      <!-- Subtitle Text -->
      <text
        y="80"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="32"
        fill="#a0a0a0"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        간단한 질문으로 확인하는
      </text>
      <text
        y="120"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="32"
        fill="#a0a0a0"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        나의 유심 안전도
      </text>
    </g>
  </g>
</svg> 