<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  fill="none"
  viewBox="0 0 1200 630"
>
  <!-- Background -->
  <rect width="1200" height="630" rx="32" fill="#0f0f0f"/>
  
  <!-- Content Container -->
  <g transform="translate(600, 280)">
    <!-- Shield Icon (left side) -->
    <g transform="translate(-400, -50) scale(8)">
      <circle cx="12" cy="12" r="11" fill="white" />
      <path
        strokeLinecap="round"
        strokeLinejoin="round"
        strokeWidth="2"
        fill="black"
        d="M12 20s6-3 6-8V6l-6-2-6 2v6c0 5 6 8 6 8z"
      />
      <path
        strokeLinecap="round"
        strokeLinejoin="round"
        strokeWidth="1.5"
        stroke="white"
        d="M9 11h6M9 14h6"
      />
      <path
        strokeLinecap="round"
        strokeLinejoin="round"
        strokeWidth="1.5"
        stroke="white"
        d="M11 9v6M13 9v6"
      />
    </g>

    <!-- Text Container (right side) -->
    <g transform="translate(100, 0)">
      <!-- Title Text -->
      <text
        font-family="system-ui, -apple-system, sans-serif"
        font-size="64"
